name: ReDream — live Render WebSocket test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'scripts/smoke-live.mjs'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify live Render health and 2-player WebSocket room
        run: node scripts/smoke-live.mjs
        env:
          TARGET_WS_URL: wss://re-dream.onrender.com/ws
          TARGET_ORIGIN: https://helioconde.github.io
