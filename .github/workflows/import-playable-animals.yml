name: Import selected animal characters
on:
  push:
    paths:
      - 'scripts/import_playable_animals.py'
      - '.github/workflows/import-playable-animals.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Read license and extract selected sprite assets for the game
        run: python scripts/import_playable_animals.py
      - name: Commit minimal game resources and credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/sprites/imported/animals
          if ! git diff --cached --quiet; then
            git commit -m "assets: include selected playable animal avatars with credit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
