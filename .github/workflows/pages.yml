name: ReDream CI and Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: redream-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Install sprite importer
        run: python -m pip install Pillow
      - name: Validate original forest stage SVG and physical platform alignment
        run: python -m unittest discover -s scripts -p 'test_arena_art.py' -v
      - name: Prepare Luci animation spritesheets
        run: python scripts/import_luci_sprites.py
      - name: Verify consistent Luci sprite scale and foot alignment
        run: python -m unittest discover -s scripts -p 'test_luci_frame_packing.py' -v
      - name: Build
        env:
          GITHUB_PAGES: 'true'
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'wss://re-dream.onrender.com/ws' }}
        run: npm run build
      - name: Upload Pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
