name: ReDream CI and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Inspect Luci sprites archive
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive = Path("Anime_fantasy_action_RPG_playable.zip")
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  if not item.is_dir():
                      print("LUCI_ZIP", item.filename, item.file_size)
          PY
      - name: Build
        env:
          GITHUB_PAGES: 'true'
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'wss://re-dream.onrender.com/ws' }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - uses: actions/deploy-pages@v4
        id: deployment
