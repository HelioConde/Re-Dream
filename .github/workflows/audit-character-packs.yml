name: Audit character ZIPs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_character_packs.py'
      - '.github/workflows/audit-character-packs.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Inspect asset archives
        run: python scripts/audit_character_packs.py
      - name: Commit inventory metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ASSET_INVENTORY.md docs/ASSET_INVENTORY.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(assets): inventory candidate character sprites and licenses"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
