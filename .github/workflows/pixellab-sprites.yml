name: PixelLab — gerar sprites e criar PR

on:
  workflow_dispatch:
    inputs:
      character:
        description: "Personagem a desenhar"
        required: true
        type: choice
        options:
          - hero
          - enemy
        default: hero
      animation_set:
        description: "Conjunto de sprites: core=idle/run/attack, full=+combate"
        required: true
        type: choice
        options:
          - core
          - full
        default: core
      generate:
        description: "Consumir créditos do PixelLab e gerar imagens (desmarcado = simulação)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pixellab-${{ inputs.character }}
  cancel-in-progress: false

jobs:
  sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar biblioteca de imagem
        run: python -m pip install "Pillow>=11,<13"

      - name: Testes locais sem uso de créditos
        run: python -m unittest discover -s tests -p 'test_pixellab*.py' -v

      - name: Validar integração e listar prompts (sem cobranças)
        if: ${{ !inputs.generate }}
        run: python tools/generate_pixellab.py --target "${{ inputs.character }}" --set "${{ inputs.animation_set }}" --dry-run

      - name: Verificar chave PixelLab
        if: ${{ inputs.generate }}
        env:
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
        run: |
          if [ -z "$PIXELLAB_API_KEY" ]; then
            echo "::error::Cadastre PIXELLAB_API_KEY em Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Gerar sprites pelo PixelLab
        if: ${{ inputs.generate }}
        env:
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
        run: python tools/generate_pixellab.py --target "${{ inputs.character }}" --set "${{ inputs.animation_set }}"

      - name: Guardar sprites e manifesto como artefato
        if: ${{ inputs.generate }}
        uses: actions/upload-artifact@v4
        with:
          name: pixellab-${{ inputs.character }}-${{ github.run_id }}
          path: assets/pixellab/${{ inputs.character }}/
          if-no-files-found: error
          retention-days: 30

      - name: Criar branch e PR para revisar sprites
        if: ${{ inputs.generate }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.character }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH="assets/pixellab-${TARGET}-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "assets/pixellab/$TARGET/"
          if git diff --staged --quiet; then
            echo "Nenhum sprite novo. Nada para enviar."
            exit 0
          fi
          git commit -m "art: PixelLab sprites para $TARGET ($RUN_ID)"
          git push origin "$BRANCH"
          if ! gh pr create --base main --head "$BRANCH" --title "art: sprites PixelLab para $TARGET" --body "Sprites gerados de verdade pelo PixelLab API v2. Confira as imagens e animações antes de integrar à main. Origem: GitHub Actions #$RUN_ID. O código do jogo usa as imagens automaticamente após merge."; then
            echo "::warning::Branch criada, mas não foi possível abrir PR automaticamente. Verifique as permissões do Actions e crie PR manualmente para $BRANCH"
          fi
