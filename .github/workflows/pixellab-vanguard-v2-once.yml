name: PixelLab V2 — Aren mágico (produção única em branch isolada)

on:
  push:
    branches:
      - art/vanguard-pixellab-core-once-20261122

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pixellab-vanguard-v2-once
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ github.repository == 'HelioConde/Re-Dream' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar suporte PNG
        run: python -m pip install "Pillow>=11,<13"
      - name: Verificar integração e plano sem cobrança
        run: |
          python -m unittest discover -s tests -p 'test_pixellab*.py' -v
          python tools/generate_pixellab.py --target vanguard --set core --dry-run
      - name: Checar segredo PixelLab existente
        env:
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
        run: |
          if [ -z "${PIXELLAB_API_KEY:-}" ]; then
            echo "::error::PIXELLAB_API_KEY ausente neste repositório. Nenhum crédito foi gasto."
            exit 1
          fi
      - name: Gerar a imagem-mestre e animações coerentes no PixelLab
        env:
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
        run: python tools/generate_pixellab.py --target vanguard --set core
      - name: Guardar os novos PNGs e manifesto para revisão
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-magic-art-v2-${{ github.run_id }}
          path: assets/pixellab/vanguard/
          retention-days: 30
          if-no-files-found: error
      - name: Criar branch de arte, nunca publicar diretamente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="assets/vanguard-magic-v2-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -c "$BRANCH" origin/main
          git add assets/pixellab/vanguard/
          if git diff --staged --quiet; then
            echo "::notice::Nenhum sprite novo para integrar."
            exit 0
          fi
          git commit -m "art: Aren mágico PixelLab V2 — idle, corrida e ataque"
          git push origin "$BRANCH"
          if ! gh pr create --base main --head "$BRANCH" --title "Art: Aren mágico V2 PixelLab — revisar antes do merge" --body "Sprites autorais gerados via PixelLab com um único sprite-mestre e animações consistentes. PR DE ARTE para QA de rosto, roupa, orientação, mãos, espada e transparência. Não integrar sem revisão visual. Action de origem: ${{ github.run_id }}."; then
            echo "::warning::PNG branch criada; use-a para abrir PR caso GitHub Actions não tenha permissão."
          fi
