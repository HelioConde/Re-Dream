name: Import uploaded sprite packs
on:
  push:
    paths:
      - '*.zip'
      - 'scripts/import_uploaded_sprites.py'
      - '.github/workflows/import-sprites.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Extract source animation frames
        run: python scripts/import_uploaded_sprites.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/sprites/imported docs/SPRITE_ASSET_AUDIT.md docs/character-sprite-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: import real animated sprites from uploaded ZIPs"
            git push origin HEAD:main
          fi
