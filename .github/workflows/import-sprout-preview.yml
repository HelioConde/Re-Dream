name: Import Sprout prototype character
on:
  push:
    paths:
      - 'scripts/import_sprout_preview.py'
      - '.github/workflows/import-sprout-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Audit rights and extract one character sprite sheet
        run: python scripts/import_sprout_preview.py
      - name: Commit credited prototype sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/sprites/imported/sprout/
          if ! git diff --cached --quiet; then
            git commit -m "assets: include credited noncommercial Sprout character prototype"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
